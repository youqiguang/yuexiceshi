name: Build TuanTuan v7 Trilingual Anime Voice
on:
  push:
    branches: [tuan-v7-voice]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android 35
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile debug signed APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Rename downloadable APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/TuanTuan-v7-TrilingualVoice.apk
          ls -lh output/TuanTuan-v7-TrilingualVoice.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TuanTuan-v7-TrilingualVoice-APK
          path: output/TuanTuan-v7-TrilingualVoice.apk
          if-no-files-found: error
