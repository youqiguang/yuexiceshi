name: Build TuanTuan Android APK
on:
  push:
    branches: [tuan-apk]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Locate preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" --list_installed | head -50
      - name: Install Android 35
        run: |
          "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile debug signed APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Rename downloadable APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/TuanTuan-v5-Android.apk
          ls -lh output/TuanTuan-v5-Android.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TuanTuan-v5-Android-APK
          path: output/TuanTuan-v5-Android.apk
          if-no-files-found: error
